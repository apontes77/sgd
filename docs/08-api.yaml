# Contrato executável OpenAPI 3.1 do SGD.
openapi: 3.1.0
info:
  title: API do Sistema de Gerenciamento de Discipulados
  version: 1.0.0
  description: |
    Contrato HTTP da API do SGD. Todos os recursos de domínio usam português,
    plural e URLs versionadas. Datas usam ISO 8601; regras de negócio usam o
    fuso America/Sao_Paulo. Exclusões lógicas são feitas por PATCH com ativo=false.
servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Usuários
  - name: Gerências
  - name: Discipulados
  - name: Adolescentes
  - name: Encontros
  - name: Frequências
  - name: Indicadores e relatórios
paths:
  /autenticacao/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário ativo
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Sessão criada, content: { application/json: { schema: { $ref: '#/components/schemas/SessaoResponse' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
  /autenticacao/atualizar-token:
    post:
      tags: [Autenticação]
      summary: Rotaciona o refresh token e emite nova sessão
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshTokenRequest' } } }
      responses:
        '200': { description: Sessão renovada, content: { application/json: { schema: { $ref: '#/components/schemas/SessaoResponse' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
  /autenticacao/esqueci-a-senha:
    post:
      tags: [Autenticação]
      summary: Solicita redefinição de senha sem revelar se o e-mail existe
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } }
      responses: { '204': { description: Solicitação recebida } }
  /autenticacao/redefinir-senha:
    post:
      tags: [Autenticação]
      summary: Redefine a senha com token de uso único
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RedefinirSenhaRequest' } } }
      responses:
        '204': { description: Senha alterada }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
  /autenticacao/eu:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário autenticado
      responses: { '200': { description: Usuário atual, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } } }
  /autenticacao/logout:
    post:
      tags: [Autenticação]
      summary: Revoga o refresh token e encerra a sessão
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshTokenRequest' } } } }
      responses: { '204': { description: Sessão encerrada } }
  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários
      description: Requer ADMIN.
      parameters: [ { $ref: '#/components/parameters/Pagina' }, { $ref: '#/components/parameters/TamanhoPagina' }, { name: ativo, in: query, schema: { type: boolean } }, { name: busca, in: query, schema: { type: string, maxLength: 120 }, description: Trecho do nome do usuário } ]
      responses: { '200': { $ref: '#/components/responses/PaginaUsuarios' }, '403': { $ref: '#/components/responses/Proibido' } }
    post:
      tags: [Usuários]
      summary: Cria usuário
      description: Requer ADMIN. Um usuário pode receber múltiplos perfis.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CriarUsuarioRequest' } } } }
      responses: { '201': { description: Usuário criado, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }, '409': { $ref: '#/components/responses/Conflito' } }
  /usuarios/{usuarioId}:
    patch:
      tags: [Usuários]
      summary: Atualiza perfis ou inativa/reativa usuário
      description: Requer ADMIN. Nunca exclui fisicamente o usuário.
      parameters: [ { $ref: '#/components/parameters/UsuarioId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarUsuarioRequest' } } } }
      responses: { '200': { description: Usuário atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }, '404': { $ref: '#/components/responses/NaoEncontrado' } }
  /gerencias:
    get:
      tags: [Gerências]
      summary: Lista gerências visíveis ao solicitante
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - { name: sexo, in: query, schema: { type: string, enum: [MASCULINO, FEMININO] } }
        - { name: faixaEtaria, in: query, schema: { $ref: '#/components/schemas/FaixaEtaria' } }
      responses: { '200': { $ref: '#/components/responses/PaginaGerencias' } }
    post:
      tags: [Gerências]
      summary: Cria uma gerência
      description: Requer ADMIN.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GerenciaRequest' } } } }
      responses: { '201': { description: Gerência criada, content: { application/json: { schema: { $ref: '#/components/schemas/Gerencia' } } } } }
  /gerencias/{gerenciaId}:
    patch:
      tags: [Gerências]
      summary: Altera nome ou gerente da gerência
      description: Requer ADMIN.
      parameters: [ { $ref: '#/components/parameters/GerenciaId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarGerenciaRequest' } } } }
      responses: { '200': { description: Gerência atualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Gerencia' } } } } }
  /discipulados:
    get:
      tags: [Discipulados]
      summary: Lista discipulados visíveis ao solicitante
      parameters: [ { $ref: '#/components/parameters/Pagina' }, { $ref: '#/components/parameters/TamanhoPagina' }, { name: gerenciaId, in: query, schema: { type: integer, format: int64 } }, { name: ativo, in: query, schema: { type: boolean } }, { name: emFormacao, in: query, schema: { type: boolean } } ]
      description: ADMIN consulta todos; GERENTE consulta suas gerências; DISCIPULADOR e CO_LIDER consultam o próprio discipulado. Perfis acumulados recebem a união dos escopos.
      responses: { '200': { $ref: '#/components/responses/PaginaDiscipulados' } }
    post:
      tags: [Discipulados]
      summary: Cria discipulado com um discipulador ativo
      description: Requer ADMIN. RN003 exige exatamente um discipulador.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiscipuladoRequest' } } } }
      responses: { '201': { description: Discipulado criado, content: { application/json: { schema: { $ref: '#/components/schemas/Discipulado' } } } } }
  /discipulados/liderados:
    get:
      tags: [Discipulados]
      summary: Lista os discipulados liderados pelo usuário autenticado
      description: Requer DISCIPULADOR ou CO_LIDER. Retorna somente grupos em que o usuário é discipulador ou co-líder.
      parameters: [ { name: ativo, in: query, schema: { type: boolean } } ]
      responses:
        '200':
          description: Discipulados próprios da liderança
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Discipulado' } } } }
        '403': { $ref: '#/components/responses/Proibido' }
  /discipulados/{discipuladoId}:
    patch:
      tags: [Discipulados]
      summary: Atualiza dados organizacionais ou inativa discipulado
      description: Requer ADMIN. Não há exclusão física.
      parameters: [ { $ref: '#/components/parameters/DiscipuladoId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarDiscipuladoRequest' } } } }
      responses: { '200': { description: Discipulado atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Discipulado' } } } } }
  /discipulados/{discipuladoId}/co-lideres:
    put:
      tags: [Discipulados]
      summary: Define os co-líderes de um discipulado
      description: Requer ADMIN. A lista aceita no máximo dois usuários (RN004). Discipulado de formação rejeita co-líderes (RN054).
      parameters: [ { $ref: '#/components/parameters/DiscipuladoId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [usuarioIds], properties: { usuarioIds: { type: array, minItems: 0, maxItems: 2, uniqueItems: true, items: { type: integer, format: int64 } } } } } } }
      responses: { '200': { description: Co-líderes atualizados, content: { application/json: { schema: { $ref: '#/components/schemas/Discipulado' } } } } }
  /adolescentes:
    get:
      tags: [Adolescentes]
      summary: Lista adolescentes por escopo de acesso
      parameters: [ { $ref: '#/components/parameters/Pagina' }, { $ref: '#/components/parameters/TamanhoPagina' }, { name: discipuladoId, in: query, schema: { type: integer, format: int64 } }, { name: ativo, in: query, schema: { type: boolean } }, { name: categoria, in: query, description: 'Filtra por uma ou mais categorias (parâmetro repetível). Ex.: categoria=DISCIPULO&categoria=VISITANTE&categoria=DISCIPULO_GOE. A chamada usa DISCIPULO como obrigatório e VISITANTE/DISCIPULO_GOE como presença opt-in (RN049).', schema: { type: array, items: { type: string, enum: [DISCIPULO, VISITANTE, DISCIPULO_GOE] } }, style: form, explode: true } ]
      responses: { '200': { $ref: '#/components/responses/PaginaAdolescentes' } }
    post:
      tags: [Adolescentes]
      summary: Cadastra adolescente, vínculo atual e ficha de família
      description: ADMIN, GERENTE, DISCIPULADOR ou CO_LIDER no respectivo escopo (RN016, RN017 e RN050). Categoria obrigatória (RN041). Ficha 1:1 sempre criada (RN048); `familia` no body é obrigatória para ADMIN/GERENTE e persistida para liderança quando informada; se omitida pela liderança, a ficha nasce como “Não consta” (RN051).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdolescenteRequest' } } } }
      responses: { '201': { description: Adolescente criado, content: { application/json: { schema: { $ref: '#/components/schemas/Adolescente' } } } } }
  /adolescentes/alertas-goe:
    get:
      tags: [Adolescentes]
      summary: Lista potenciais discípulos GOE
      description: Adolescentes ativos na categoria DISCIPULO com ao menos 4 faltas em encontros realizados nas últimas 6 semanas (RN043).
      parameters: [ { name: discipuladoId, in: query, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: Alertas GOE, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AlertaGoe' } } } } } }
  /adolescentes/{adolescenteId}:
    patch:
      tags: [Adolescentes]
      summary: Atualiza cadastro ou inativa adolescente
      description: ADMIN ou liderança do próprio discipulado. A inativação preserva histórico (RN016, RN017 e RN018); alterar discipulado por esta operação é proibido.
      parameters: [ { $ref: '#/components/parameters/AdolescenteId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdolescenteRequest' } } } }
      responses: { '200': { description: Adolescente atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Adolescente' } } } } }
  /adolescentes/{adolescenteId}/vinculos:
    post:
      tags: [Adolescentes]
      summary: Transfere adolescente para outro discipulado
      description: ADMIN (global) ou GERENTE (origem e destino na própria gerência). Encerra o vínculo ativo anterior e cria outro; mantém histórico (RN001, RN002 e RN029).
      parameters: [ { $ref: '#/components/parameters/AdolescenteId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [discipuladoId, dataInicio], properties: { discipuladoId: { type: integer, format: int64 }, dataInicio: { type: string, format: date } } } } } }
      responses: { '201': { description: Vínculo criado, content: { application/json: { schema: { $ref: '#/components/schemas/Vinculo' } } } }, '401': { $ref: '#/components/responses/NaoAutorizado' }, '403': { $ref: '#/components/responses/Proibido' }, '404': { $ref: '#/components/responses/NaoEncontrado' }, '409': { $ref: '#/components/responses/Conflito' } }
  /adolescentes/{adolescenteId}/familia:
    get:
      tags: [Adolescentes]
      summary: Consulta a ficha de família do adolescente
      description: ADMIN (global), GERENTE (própria gerência) ou liderança do discipulado (RN051).
      parameters: [ { $ref: '#/components/parameters/AdolescenteId' } ]
      responses: { '200': { description: Ficha de família }, '403': { $ref: '#/components/responses/Proibido' } }
    put:
      tags: [Adolescentes]
      summary: Cria ou atualiza a ficha de família do adolescente
      description: ADMIN (global), GERENTE (própria gerência) ou liderança do discipulado (RN051).
      parameters: [ { $ref: '#/components/parameters/AdolescenteId' } ]
      responses: { '200': { description: Ficha salva }, '403': { $ref: '#/components/responses/Proibido' } }
  /familias:
    get:
      tags: [Adolescentes]
      summary: Lista fichas de família no escopo do usuário
      description: ADMIN vê todas; GERENTE a gerência; DISCIPULADOR/CO_LIDER o próprio discipulado (RN051). Paginação obrigatória. Filtros opcionais por texto (nome do adolescente ou discipulado), situacaoIgreja e situacaoPais.
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
        - { name: busca, in: query, schema: { type: string }, description: Trecho do nome do adolescente ou do discipulado }
        - { name: situacaoIgreja, in: query, schema: { type: string, enum: [FDV_ATUANTES, FDV_NAO_ATUANTES, OUTRA_IGREJA, NAO_CRISTA, AFASTADA, NAO_CONSTA] } }
        - { name: situacaoPais, in: query, schema: { type: string, enum: [CASADOS, SEPARADOS, FALECIDOS, ADOTIVOS, HOMOAFETIVOS, NULOS, NAO_CONSTA] } }
      responses: { '200': { description: Página de fichas } }
  /encontros:
    get:
      tags: [Encontros]
      summary: Lista encontros
      parameters: [ { name: discipuladoId, in: query, required: true, schema: { type: integer, format: int64 } }, { name: dataInicio, in: query, schema: { type: string, format: date } }, { name: dataFim, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: Encontros, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Encontro' } } } } } }
    post:
      tags: [Encontros]
      summary: Registra encontro realizado ou não realizado
      description: ADMIN registra qualquer situação em qualquer discipulado ativo; DISCIPULADOR registra encontros realizados ou não realizados no próprio discipulado; CO_LIDER registra somente encontros realizados. Não realizados exigem justificativa.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EncontroRequest' } } } }
      responses: { '201': { description: Encontro criado, content: { application/json: { schema: { $ref: '#/components/schemas/Encontro' } } } } }
  /encontros/{encontroId}:
    patch:
      tags: [Encontros]
      summary: Altera data, situação, justificativa ou observação do encontro
      description: Campos omitidos permanecem inalterados. A observação é opcional (até 500 caracteres), independente da situação, e fica registrada na auditoria. Justificativa continua obrigatória somente quando a situação resultante for NAO_REALIZADO. A reversão de NAO_REALIZADO para REALIZADO é exclusiva de ADMIN e preserva fechamentoAutomatico quando o encontro veio do job de prazo.
      parameters: [ { $ref: '#/components/parameters/EncontroId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarEncontroRequest' } } } }
      responses: { '200': { description: Encontro atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Encontro' } } } } }
    delete:
      tags: [Encontros]
      summary: Exclui o encontro e a chamada da data
      description: Exclusivo de ADMIN. Remove frequências, visitantes e o encontro, liberando o par discipulado+data. Não desfaz promoção automática de categoria (RN045). Auditoria EXCLUIR.
      parameters: [ { $ref: '#/components/parameters/EncontroId' } ]
      responses:
        '204': { description: Encontro excluído }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /encontros/{encontroId}/frequencias:
    get:
      tags: [Frequências]
      summary: Lista a chamada do encontro
      parameters: [ { $ref: '#/components/parameters/EncontroId' } ]
      responses: { '200': { description: Chamada, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Frequencia' } } } } } }
    put:
      tags: [Frequências]
      summary: Registra ou substitui a chamada do encontro
      description: ADMIN, DISCIPULADOR ou CO_LIDER do discipulado. Discípulos ativos (DISCIPULO) são obrigatórios na chamada; VISITANTE e DISCIPULO_GOE só entram como PRESENTE quando comparecem, e omitir apaga o registro (RN049). Preserva frequência já lançada de discípulos que saíram do grupo. Um adolescente só pode ter uma frequência por encontro (RN006).
      parameters: [ { $ref: '#/components/parameters/EncontroId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [frequencias], properties: { frequencias: { type: array, items: { $ref: '#/components/schemas/FrequenciaRequest' } } } } } } }
      responses: { '200': { description: Chamada salva; o primeiro salvamento define chamadaSalvaEm e inicia a janela de três horas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Frequencia' } } } } }, '403': { description: Fora da janela de três horas ou do prazo de lançamento (sexta até domingo subsequente) para líder ou co-líder, $ref: '#/components/responses/Proibido' } }
  /encontros/{encontroId}/visitantes:
    put:
      tags: [Frequências]
      summary: Registra a quantidade de visitantes do encontro
      parameters: [ { $ref: '#/components/parameters/EncontroId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quantidade], properties: { quantidade: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { description: Visitantes registrados } }
  /painel/lider:
    get:
      tags: [Indicadores e relatórios]
      summary: Histórico de frequência do discipulado liderado pelo usuário autenticado
      description: Requer DISCIPULADOR ou CO_LIDER. Outros perfis acumulados não ampliam o escopo deste painel; exige exatamente uma associação de liderança (RN028, RN030 e RN031).
      parameters:
        - { name: dataInicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: dataFim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Histórico do discipulado, content: { application/json: { schema: { $ref: '#/components/schemas/PainelLiderResponse' } } } }
        '400': { description: Período ausente, invertido ou superior a 24 meses, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /painel/gerencia:
    get:
      tags: [Indicadores e relatórios]
      summary: Histórico de frequência da gerência do usuário autenticado
      description: Requer GERENTE e exige exatamente uma gerência ativa associada ao usuário.
      parameters:
        - { name: dataInicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: dataFim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Painel da gerência, content: { application/json: { schema: { $ref: '#/components/schemas/PainelGerenciaResponse' } } } }
        '400': { description: Período ausente, invertido ou superior a 24 meses, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /painel/admin:
    get:
      tags: [Indicadores e relatórios]
      summary: Retorna o painel administrativo de frequência
      description: Requer ADMIN. Exclui encontros não realizados e não inclui visitantes no percentual de presença.
      parameters:
        - { name: dataInicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: dataFim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Painel administrativo, content: { application/json: { schema: { $ref: '#/components/schemas/PainelAdminResponse' } } } }
        '400': { description: Período ausente, invertido ou superior a 24 meses, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
        '403': { $ref: '#/components/responses/Proibido' }
  /relatorios/frequencia-diaria:
  /relatorios/frequencia:
    get:
      tags: [Indicadores e relatórios]
      summary: Consulta o relatório de frequência por período
      description: Aplica o escopo cumulativo do usuário e retorna encontros REALIZADO e NAO_REALIZADO do período. Cada registro corresponde a uma página na impressão; não realizados incluem a justificativa. A lista `participantes` vem preenchida somente quando dataInicio é igual a dataFim; em intervalos maiores o array fica vazio e os totais permanecem em resumo.
      parameters:
        - { name: dataInicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: dataFim, in: query, required: true, schema: { type: string, format: date } }
        - { name: discipuladoId, in: query, required: false, schema: { type: integer, format: int64 }, description: Filtra o relatório para um discipulado do escopo do usuário. }
      responses:
        '200': { description: Relatórios dos encontros do período (realizados e não realizados), content: { application/json: { schema: { $ref: '#/components/schemas/RelatorioFrequenciaPeriodoResponse' } } } }
        '400': { description: Período ausente, invertido ou superior a 12 meses, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { description: Usuário sem associação organizacional aplicável, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

    get:
      tags: [Indicadores e relatórios]
      summary: Consulta o relatório diário de frequência do escopo autenticado
      description: Endpoint compatível para consulta de um único dia; delega ao mesmo serviço de período com início e fim iguais.
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, format: date } }
        - { name: discipuladoId, in: query, required: false, schema: { type: integer, format: int64 }, description: Filtra o relatório para um discipulado do escopo do usuário. }
      responses:
        '200': { description: Relatórios dos encontros da data (realizados e não realizados); a lista pode ser vazia, content: { application/json: { schema: { $ref: '#/components/schemas/RelatorioFrequenciaDiariaResponse' } } } }
        '400': { description: Data ausente ou inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { $ref: '#/components/responses/NaoAutorizado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { description: Usuário sem associação organizacional aplicável, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /relatorios/mensal:
    get:
      tags: [Indicadores e relatórios]
      summary: Exporta relatório mensal
      parameters: [ { name: referencia, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }, { name: formato, in: query, required: true, schema: { type: string, enum: [pdf, xlsx] } } ]
      responses: { '200': { description: Arquivo gerado, content: { application/pdf: { schema: { type: string, format: binary } }, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } } }
  /auditoria:
    get:
      tags: [Indicadores e relatórios]
      summary: Consulta registros de auditoria
      description: Requer ADMIN.
      parameters: [ { $ref: '#/components/parameters/Pagina' }, { $ref: '#/components/parameters/TamanhoPagina' }, { name: entidade, in: query, schema: { type: string } }, { name: usuarioId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: Eventos de auditoria, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaAuditoria' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Pagina: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    TamanhoPagina: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    UsuarioId: { name: usuarioId, in: path, required: true, schema: { type: integer, format: int64 } }
    GerenciaId: { name: gerenciaId, in: path, required: true, schema: { type: integer, format: int64 } }
    DiscipuladoId: { name: discipuladoId, in: path, required: true, schema: { type: integer, format: int64 } }
    AdolescenteId: { name: adolescenteId, in: path, required: true, schema: { type: integer, format: int64 } }
    EncontroId: { name: encontroId, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    NaoAutorizado: { description: Credenciais ausentes, inválidas ou expiradas, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
    Proibido: { description: Usuário autenticado sem permissão para a operação, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
    NaoEncontrado: { description: Recurso não encontrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
    Conflito: { description: Violação de regra de negócio ou estado conflitante, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
    PaginaUsuarios: { description: Página de usuários, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaUsuario' } } } }
    PaginaGerencias: { description: Página de gerências, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaGerencia' } } } }
    PaginaDiscipulados: { description: Página de discipulados, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaDiscipulado' } } } }
    PaginaAdolescentes: { description: Página de adolescentes, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaAdolescente' } } } }
  schemas:
    Problema: { type: object, required: [type, title, status, detail, traceId], properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, traceId: { type: string } } }
    LoginRequest: { type: object, required: [email, senha], properties: { email: { type: string, format: email }, senha: { type: string, format: password } } }
    RefreshTokenRequest: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
    EmailRequest: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    RedefinirSenhaRequest: { type: object, required: [token, novaSenha], properties: { token: { type: string }, novaSenha: { type: string, format: password, minLength: 6, description: Deve conter letra maiúscula, minúscula, número e caractere especial } } }
    SessaoResponse: { type: object, required: [accessToken, refreshToken, usuario], properties: { accessToken: { type: string }, refreshToken: { type: string }, usuario: { $ref: '#/components/schemas/Usuario' } } }
    Perfil: { type: string, enum: [ADMIN, GERENTE, DISCIPULADOR, CO_LIDER] }
    Usuario: { type: object, required: [id, nome, email, ativo, perfis], properties: { id: { type: integer, format: int64 }, nome: { type: string }, email: { type: string, format: email }, ativo: { type: boolean }, perfis: { type: array, items: { $ref: '#/components/schemas/Perfil' } } } }
    CriarUsuarioRequest: { type: object, required: [nome, email, senha, perfis], properties: { nome: { type: string, minLength: 1, maxLength: 120 }, email: { type: string, format: email }, senha: { type: string, format: password, minLength: 12 }, perfis: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Perfil' } } } }
    AtualizarUsuarioRequest: { type: object, properties: { nome: { type: string, minLength: 1, maxLength: 120 }, perfis: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Perfil' } }, ativo: { type: boolean } } }
    FaixaEtaria: { type: string, enum: [DE_09_A_11, DE_11_A_13, DE_13_A_15, DE_15_MAIS] }
    GerenciaRequest: { type: object, required: [nome, sexo, faixasEtarias, gerenteId], properties: { nome: { type: string, minLength: 1, maxLength: 120 }, sexo: { type: string, enum: [MASCULINO, FEMININO] }, faixasEtarias: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/FaixaEtaria' } }, gerenteId: { type: integer, format: int64 } } }
    AtualizarGerenciaRequest: { type: object, minProperties: 1, properties: { nome: { type: string, minLength: 1, maxLength: 120 }, sexo: { type: string, enum: [MASCULINO, FEMININO] }, faixasEtarias: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/FaixaEtaria' } }, gerenteId: { type: integer, format: int64 }, ativo: { type: boolean } } }
    Gerencia: { allOf: [ { $ref: '#/components/schemas/GerenciaRequest' }, { type: object, required: [id], properties: { id: { type: integer, format: int64 } } } ] }
    DiscipuladoRequest: { type: object, required: [nome, sexo, faixaEtaria, discipuladorId], properties: { nome: { type: string, minLength: 1, maxLength: 120 }, sexo: { type: string, enum: [MASCULINO, FEMININO] }, faixaEtaria: { $ref: '#/components/schemas/FaixaEtaria' }, gerenciaId: { type: [integer, 'null'], format: int64, description: Obrigatório no discipulado padrão; nulo no de formação. }, discipuladorId: { type: integer, format: int64 }, ativo: { type: boolean }, emFormacao: { type: boolean, description: Quando true, o discipulado não possui gerência nem co-líder. } } }
    AtualizarDiscipuladoRequest: { type: object, minProperties: 1, properties: { nome: { type: string, minLength: 1, maxLength: 120 }, sexo: { type: string, enum: [MASCULINO, FEMININO] }, faixaEtaria: { $ref: '#/components/schemas/FaixaEtaria' }, gerenciaId: { type: [integer, 'null'], format: int64 }, discipuladorId: { type: integer, format: int64 }, ativo: { type: boolean } } }
    Discipulado: { allOf: [ { $ref: '#/components/schemas/DiscipuladoRequest' }, { type: object, required: [id, discipuladorNome, coLideres], properties: { id: { type: integer, format: int64 }, discipuladorNome: { type: string, description: Nome do discipulador titular, usado na seleção tipável e no contexto de liderança na UI. }, coLideres: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/Usuario' }, description: 'Índice 0 = co-líder; índice 1 = co-líder em treinamento.' } } } ] }
    AdolescenteRequest: { type: object, required: [nome, dataNascimento, categoria, consentimentoEm, discipuladoId], properties: { nome: { type: string, minLength: 1, maxLength: 120 }, dataNascimento: { type: string, format: date }, telefone: { type: string, description: 'Obrigatório quando categoria for DISCIPULO_GOE, salvo se naoPossuiTelefone=true (RN048).' }, naoPossuiTelefone: { type: boolean, description: 'Quando true, o telefone do adolescente fica vazio e a obrigatoriedade de telefone em DISCIPULO_GOE é dispensada.' }, naoPossuiContatoFamiliar: { type: boolean, description: 'Quando true, os contatos de mãe/pai/responsável ficam vazios e a obrigatoriedade de contato familiar em DISCIPULO/VISITANTE é dispensada.' }, instagram: { type: string }, responsavelNome: { type: string }, responsavelTelefone: { type: string }, consentimentoEm: { type: string, format: date }, categoria: { type: string, enum: [DISCIPULO, VISITANTE, DISCIPULO_GOE] }, telefoneMae: { type: string }, telefonePai: { type: string }, estrutura: { type: string, maxLength: 120 }, motivoAfastamento: { type: string, maxLength: 500, description: Obrigatório quando categoria for DISCIPULO_GOE. }, discipuladoId: { type: integer, format: int64 }, ativo: { type: boolean }, dataInicio: { type: string, format: date, description: Data de início do vínculo com o discipulado. Padrão é a data atual; usada ao registrar um visitante em uma data anterior. }, familia: { type: object, description: 'Obrigatória para ADMIN/GERENTE; ignorada para DISCIPULADOR/CO_LIDER (ficha automática “Não consta”, RN051).' } }, description: 'Ficha de família 1:1 (RN048). ADMIN/GERENTE devem enviar `familia`; liderança omite e o servidor cria “Não consta” (RN051). Contatos familiares vivem na ficha, não nestes campos legados.' }
    Adolescente: { allOf: [ { $ref: '#/components/schemas/AdolescenteRequest' }, { type: object, required: [id, anonimizado], properties: { id: { type: integer, format: int64 }, discipuladoNome: { type: string }, anonimizado: { type: boolean } } } ] }
    AlertaGoe: { type: object, required: [adolescenteId, nome, faltas], properties: { adolescenteId: { type: integer, format: int64 }, nome: { type: string }, faltas: { type: integer, format: int64 } } }
    Vinculo: { type: object, required: [id, adolescenteId, discipuladoId, dataInicio, ativo], properties: { id: { type: integer, format: int64 }, adolescenteId: { type: integer, format: int64 }, discipuladoId: { type: integer, format: int64 }, dataInicio: { type: string, format: date }, dataFim: { type: string, format: date }, ativo: { type: boolean } } }
    EncontroRequest: { type: object, required: [discipuladoId, data, situacao], description: Existe no máximo um encontro por discipulado e data. A observação não é definida na criação; use PATCH depois do registro., properties: { discipuladoId: { type: integer, format: int64 }, data: { type: string, format: date }, situacao: { type: string, enum: [REALIZADO, NAO_REALIZADO] }, justificativa: { type: [string, 'null'], maxLength: 500, description: Obrigatória quando a situação for NAO_REALIZADO e nula quando for REALIZADO. } } }
    AtualizarEncontroRequest: { type: object, minProperties: 1, description: Atualização parcial do encontro. Omitir um campo preserva o valor atual., properties: { data: { type: string, format: date }, situacao: { type: string, enum: [REALIZADO, NAO_REALIZADO] }, justificativa: { type: [string, 'null'], maxLength: 500, description: Obrigatória quando a situação resultante for NAO_REALIZADO. }, observacao: { type: [string, 'null'], maxLength: 500, description: Texto livre opcional sobre o encontro (ex. ocorrências da chamada). String vazia ou só espaços é persistida como nulo. } } }
    Encontro: { allOf: [ { $ref: '#/components/schemas/EncontroRequest' }, { type: object, required: [id, criadoEm, fechamentoAutomatico], properties: { id: { type: integer, format: int64 }, observacao: { type: [string, 'null'], maxLength: 500, description: Observação opcional do encontro (RN050). }, criadoEm: { type: string, format: date-time }, chamadaSalvaEm: { type: [string, 'null'], format: date-time, description: Instant do primeiro salvamento da chamada; ancora a janela de três horas. }, fechamentoAutomatico: { type: boolean, description: True quando o encontro foi criado ou convertido pelo fechamento automático do prazo (RN047); permanece após ADMIN reverter para REALIZADO (RN052). } } } ] }
    FrequenciaRequest: { type: object, required: [adolescenteId, situacao], properties: { adolescenteId: { type: integer, format: int64 }, situacao: { type: string, enum: [PRESENTE, AUSENTE], description: DISCIPULO aceita PRESENTE ou AUSENTE. VISITANTE e DISCIPULO_GOE só podem ser enviados como PRESENTE; omitir remove o registro (RN049). } } }
    Frequencia: { allOf: [ { $ref: '#/components/schemas/FrequenciaRequest' }, { type: object, required: [id, encontroId, adolescenteNome], properties: { id: { type: integer, format: int64 }, encontroId: { type: integer, format: int64 }, adolescenteNome: { type: string }, categoria: { type: string, enum: [DISCIPULO, VISITANTE, DISCIPULO_GOE] }, registradaEm: { type: string, format: date-time } } } ] }
    IdentificacaoRelatorio: { type: object, required: [id, nome], properties: { id: { type: integer, format: int64 }, nome: { type: string } } }
