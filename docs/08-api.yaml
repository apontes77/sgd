    ResumoRelatorio: { type: object, required: [presentes, ausentes, participantes, visitantes, goe, percentualPresenca], properties: { presentes: { type: integer, format: int64, description: Discípulos (DISCIPULO) presentes. }, ausentes: { type: integer, format: int64, description: Discípulos (DISCIPULO) ausentes. }, participantes: { type: integer, format: int64, description: presentes + ausentes (somente DISCIPULO). }, visitantes: { type: integer }, goe: { type: integer, description: Discípulos GOE presentes. }, percentualPresenca: { type: number, format: double } } }
